_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

train_datasets:
  viperx_right_arm:
    _target_: egomimic.rldb.utils.FolderRLDBDataset
    folder_path: /data/sybeuret/remote_data_lerobot/egoverse_data
    embodiment: viperx_right_arm
    mode: train
    video_backend: pyav
    camera_keys:
      - observation.images.front_img_1
      - observation.images.right_wrist_img
    state_keys:
      - observation.state         
    resolver:
      key_map:
        observation.images.front_img_1: front_img_1
        observation.images.right_wrist_img: right_wrist_img
        actions.joints_act: actions_joints
        observation.state: joint_positions

  aria_left_arm:
    _target_: egomimic.rldb.utils.FolderRLDBDataset
    folder_path: /data/sybeuret/remote_aria_data/egoverse_data
    embodiment: aria_left_arm
    mode: train
    video_backend: pyav
    camera_keys:
      - observations.images.front_img_1
    state_keys:
      - observations.state.ee_pose               
    key_map:
      "observations.images.front_img_1": front_img_1
      actions_cartesian: actions_cartesian 
      "observations.state.ee_pose": state_ee_pose

valid_datasets:
  viperx_right_arm:
    _target_: egomimic.rldb.utils.FolderRLDBDataset
    folder_path: /data/sybeuret/remote_data_lerobot/egoverse_data
    embodiment: viperx_right_arm
    mode: valid
    video_backend: pyav
    camera_keys:
      - observation.images.front_img_1
      - observation.images.right_wrist_img
    state_keys:
      - observation.state               
    resolver:
      key_map:
        observation.images.front_img_1: front_img_1
        observation.images.right_wrist_img: right_wrist_img 
        actions.joints_act: actions_joints
        observation.state: joint_positions

  aria_left_arm:
    _target_: egomimic.rldb.utils.FolderRLDBDataset
    folder_path: /data/sybeuret/remote_aria_data/egoverse_data
    embodiment: aria_left_arm
    mode: valid
    video_backend: pyav
    camera_keys:
      - observations.images.front_img_1
    state_keys:
      - observations.state.ee_pose             
    key_map:
      "observations.images.front_img_1": front_img_1
      actions_cartesian: actions_cartesian
      "observations.state.ee_pose": state_ee_pose

train_dataloader_params:
  viperx_right_arm:
    batch_size: 8
    num_workers: 4
    persistent_workers: true
    prefetch_factor: 2
    pin_memory: true
    timeout: 120
  aria_left_arm:
    batch_size: 8
    num_workers: 4
    persistent_workers: true
    prefetch_factor: 2
    pin_memory: true
    timeout: 120

valid_dataloader_params:
  viperx_right_arm:
    batch_size: 8
    num_workers: 0
    pin_memory: false
    timeout: 0
  aria_left_arm:
    batch_size: 8
    num_workers: 0
    pin_memory: false
    timeout: 0
