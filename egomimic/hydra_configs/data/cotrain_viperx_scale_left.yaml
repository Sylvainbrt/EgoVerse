train_dataloader_params:
  viperx_left_arm:
    batch_size: 8
    num_workers: 4
    persistent_workers: true
    prefetch_factor: 2
    pin_memory: true
    timeout: 120
  scale_bimanual:
    batch_size: 16
    num_workers: 16
    persistent_workers: true
    prefetch_factor: 4
    pin_memory: true
  
valid_dataloader_params:
  viperx_left_arm:
    batch_size: 8
    num_workers: 0
    pin_memory: false
    timeout: 0
  scale_bimanual:
    batch_size: 16
    num_workers: 16
    persistent_workers: true
    prefetch_factor: 4
    pin_memory: true
