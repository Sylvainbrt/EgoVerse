defaults:
  - hpt_cotrain_viperx_aria

robomimic_model:
  mix_schedule:
    enabled: true
    unit: progress
    normalize: true
    profile: default
    profiles:
      soft:
        domains:
          viperx_right_arm:
            type: constant
            value: 1.0
          aria_left_arm:
            type: piecewise_linear
            points:
              - [0.0, 1.25]
              - [0.15, 1.25]
              - [0.50, 1.0]
              - [0.85, 0.80]
              - [1.0, 0.80]
      default:
        domains:
          viperx_right_arm:
            type: constant
            value: 1.0
          aria_left_arm:
            type: piecewise_linear
            points:
              - [0.0, 1.75]
              - [0.15, 1.75]
              - [0.50, 1.0]
              - [0.85, 0.60]
              - [1.0, 0.60]
      aggressive:
        domains:
          viperx_right_arm:
            type: constant
            value: 1.0
          aria_left_arm:
            type: piecewise_linear
            points:
              - [0.0, 3.0]
              - [0.10, 3.0]
              - [0.40, 1.0]
              - [0.80, 0.25]
              - [1.0, 0.25]
